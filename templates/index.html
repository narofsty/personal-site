<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>" />
  <!-- 标记「JS 可用」：只有这个类存在时，滚动淡入才会先把内容隐藏起来。
       这样即使 JS 完全失效，页面内容依然可见，不会变成白屏。 -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="nav__logo" href="#top">{{NAME}}<span>.</span></a>

      <nav class="nav__links" id="navLinks">
        <a href="#progress">学习进度</a>
        <a href="#activity">提交动态</a>
        <a href="#posts">文章</a>
      </nav>

      <div class="nav__actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深色/浅色主题" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav__burger" id="navBurger" type="button" aria-label="展开导航菜单">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- 个人信息：只有姓名和邮箱 -->
    <section class="intro">
      <div class="container">
        <h1 class="intro__name">{{NAME}}<span class="intro__alias">（{{ALIAS}}）</span></h1>
        <p class="intro__desc">{{DESCRIPTION}}</p>
        <ul class="emails">
        {{EMAILS}}
        </ul>
      </div>
    </section>

    <!-- 学习进度 -->
    <section class="section" id="progress">
      <div class="container">
        <h2 class="section__title">学习进度</h2>
        <div class="tracks">
      {{TRACKS}}
        </div>
      </div>
    </section>

    <!-- 提交动态 -->
    <section class="section" id="activity">
      <div class="container">
        <h2 class="section__title">提交动态</h2>
        <div class="stats">
        {{STATS}}
        </div>
        <div class="card heat">
        {{HEATMAP}}
        </div>
        <div class="card activity">
        {{TIMELINE}}
        </div>
      </div>
    </section>

    <!-- 文章 -->
    <section class="section" id="posts">
      <div class="container">
        <h2 class="section__title">文章</h2>
        <div class="posts">
      {{POSTS}}
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> {{NAME}} · 数据更新于 {{GENERATED_AT}}</p>
    </div>
  </footer>

  <!-- onerror 兜底：万一 main.js 路径写错或被改名，立刻恢复内容可见 -->
  <script src="main.js" onerror="document.documentElement.classList.remove('js');"></script>
</body>
</html>
